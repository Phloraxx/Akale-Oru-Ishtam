name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AkaleOruIstham/package-lock.json

      - name: Install dependencies
        working-directory: AkaleOruIstham
        run: npm ci

      - name: Typecheck
        working-directory: AkaleOruIstham
        run: npx tsc --noEmit
